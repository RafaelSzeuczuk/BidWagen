name: BidWagen
description: BidWagen - apoio profissional para avaliação e compra de veículos.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.1
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  table_calendar: ^3.1.3
  image_picker: ^1.1.2
  http: ^1.2.2
  flutter_dotenv: ^5.2.0
  mask_text_input_formatter: ^2.9.0
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  path_provider_foundation: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo.png
  adaptive_icon_background: "#071A2B"
  adaptive_icon_foreground: assets/logo.png

flutter_native_splash:
  color: "#071A2B"
  image: assets/logo.png
  android_12:
    color: "#071A2B"
    image: assets/logo.png
